version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: careerlens_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: careerlens
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d careerlens"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careerlens_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/careerlens
      - LLM_PROVIDER=groq
      - LLM_MODEL=llama-3.3-70b-versatile
      - LLM_API_KEY=${LLM_API_KEY:-}
      - UPLOAD_DIR=/app/uploads
      - FRONTEND_ORIGIN=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: careerlens_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_USE_MOCK=false
      - NEXT_PUBLIC_API_URL=http://backend:8000/api/v1
    depends_on:
      - backend

volumes:
  pgdata:
